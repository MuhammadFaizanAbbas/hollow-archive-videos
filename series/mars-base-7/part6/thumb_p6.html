<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Inter';font-weight:900;src:url('fonts/Inter-Black.otf');} html,body{margin:0;background:#000} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><canvas id="c" width="2160" height="3840"></canvas>
<script type="module">
import { drawToon, INK } from './src/core/toon.js';
const c = document.getElementById('c'), g = c.getContext('2d'), W = 2160, H = 3840;
const R = (s) => { let x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
await document.fonts.load('900 100px Inter');
let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#12081F'); gr.addColorStop(0.5, '#4A1A2E'); gr.addColorStop(1, '#8A3A22'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
g.fillStyle = '#fff'; for (let i = 0; i < 60; i++) { g.globalAlpha = 0.3 + R(i) * 0.6; g.beginPath(); g.arc(R(i * 3.7) * W, R(i * 8.3) * H * 0.4, 2 + R(i * 2) * 5, 0, 7); g.fill(); } g.globalAlpha = 1;
// canyon silhouettes
g.fillStyle = '#2A0F18'; [[0,2000,520,1840],[480,1700,460,2140],[1500,1800,420,2040],[1850,1500,310,2340]].forEach(([x,y,w,h])=>g.fillRect(x,y,w,h));
// purple lights row
for (let i = 0; i < 8; i++) { const x = 140 + i * 270, y = 1480 + 40 * Math.sin(i); gr = g.createRadialGradient(x, y, 4, x, y, 120); gr.addColorStop(0, 'rgba(210,150,255,1)'); gr.addColorStop(1, 'rgba(199,125,255,0)'); g.fillStyle = gr; g.fillRect(x - 130, y - 130, 260, 260); g.fillStyle = '#E8C8FF'; g.beginPath(); g.arc(x, y, 30, 0, 7); g.fill(); }
// glowing doorway (hero object)
gr = g.createRadialGradient(1650, 2500, 80, 1650, 2500, 1100); gr.addColorStop(0, 'rgba(255,200,120,0.9)'); gr.addColorStop(1, 'rgba(255,160,80,0)'); g.fillStyle = gr; g.fillRect(0, 1300, W, 2500);
g.strokeStyle = INK; g.lineWidth = 26; g.fillStyle = '#FFC878'; g.beginPath(); g.roundRect(1330, 2000, 620, 1100, 40); g.fill(); g.stroke();
g.strokeStyle = '#C77DFF'; g.lineWidth = 30; g.beginPath(); g.roundRect(1300, 1970, 680, 1160, 50); g.stroke();
// HIRO big scared face
g.save(); g.translate(-260, 1340); g.scale(4.2, 4.2);
drawToon(g, { body: '#E8782B', hat: 'none', hair: 'short', hairCol: '#8A8A92', extra: ['glasses'] }, { mood: 'scared', look: [0.5, 0.1], talk: 0.4, sweat: 1, armR: [150, 20], armL: [14, 10] });
g.restore();
gr = g.createRadialGradient(W / 2, H * 0.5, H * 0.3, W / 2, H * 0.5, H * 0.78); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,5,20,0.6)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
const word = (s, x, y, size, fill, glow, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillText(s, 14, 30); g.lineWidth = size * 0.2; g.strokeStyle = '#0B0B14'; g.strokeText(s, 0, 0); if (glow) { g.shadowColor = glow; g.shadowBlur = 60; } g.fillStyle = fill; g.fillText(s, 0, 0); g.restore(); };
const fit = (s, size, maxW) => { g.font = `900 ${size}px Inter`; return Math.min(size, size * maxW / g.measureText(s).width); };
word("DON'T KNOCK", W / 2, 470, fit("DON'T KNOCK", 360, 1950), '#FFFFFF', '#FFE08A', -0.03);
word('(MEI DID)', W / 2, 840, fit('(MEI DID)', 380, 1950), '#FF6B6B', null, -0.03);
const pill = (txt, x, y, bg, rot, size, fg = '#FFFFFF') => { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; const w = g.measureText(txt).width + 110; g.fillStyle = bg; g.strokeStyle = '#0B0B14'; g.lineWidth = 12; g.beginPath(); g.roundRect(-w / 2, -size * 0.8, w, size * 1.6, 28); g.fill(); g.stroke(); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 0, 0); g.restore(); };
pill('MARS BASE 7', 480, 140, '#2E5FA8', -0.05, 84); pill('PART 6', 1850, 140, '#FFD43B', 0.05, 84, '#0B0B14');
document.title = 'DONE';
</script></body></html>
