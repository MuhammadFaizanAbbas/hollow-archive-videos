<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Inter';font-weight:900;src:url('fonts/Inter-Black.otf');} html,body{margin:0;background:#000} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><canvas id="c" width="2560" height="1440"></canvas>
<script type="module">
import { drawToon, INK } from './src/core/toon.js';
const c = document.getElementById('c'), g = c.getContext('2d'), W = 2560, H = 1440;
const R = (s) => { let x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
await document.fonts.load('900 100px Inter');
// 1. background: deep night blue, warm glow from the radio
let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0F1A44'); gr.addColorStop(0.6, '#2A2F7A'); gr.addColorStop(1, '#4A2A5A'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(255,255,255,${0.25 + R(i) * 0.6})`; g.beginPath(); g.arc(R(i * 3.3) * W, R(i * 7.1) * 700, 2 + R(i * 1.7) * 5, 0, 7); g.fill(); }
// floor / bench
g.fillStyle = '#6E4524'; g.fillRect(0, 1130, W, 310); g.fillStyle = '#8A5A36'; g.fillRect(0, 1130, W, 36);
const px = 1330, py = 780;
gr = g.createRadialGradient(px, py, 40, px, py, 900); gr.addColorStop(0, 'rgba(255,225,130,0.95)'); gr.addColorStop(0.3, 'rgba(255,170,60,0.5)'); gr.addColorStop(1, 'rgba(255,140,40,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
g.save(); g.translate(px, py); g.globalCompositeOperation = 'screen'; for (let i = 0; i < 16; i++) { g.rotate(Math.PI * 2 / 16); g.fillStyle = 'rgba(255,235,160,0.18)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-70, -1100); g.lineTo(70, -1100); g.closePath(); g.fill(); } g.restore();
// 2. Mari: huge left, shocked at the radio
g.save(); g.translate(-210, 190); g.scale(1.9, 1.9);
drawToon(g, { body: '#E8574A', pattern: 'overalls', patCol: '#35557A', hair: 'bob', hairCol: '#2A1A14', head: '#D9A877', kid: true, extra: ['freckles'], neck: 'scarf', neckCol: '#F4C430' },
  { mood: 'shock', look: [0.9, 0.1], talk: 0.85, sweat: 1, armR: [62, 38], armL: [14, 10] });
g.restore();
// 3. the radio, big, glowing, TUE on the dial
g.save(); g.translate(px, py); g.lineJoin = 'round'; g.strokeStyle = INK; g.lineWidth = 18;
g.fillStyle = '#9A6337'; g.beginPath(); g.roundRect(-420, -250, 840, 500, 56); g.fill(); g.stroke();
g.fillStyle = '#B77C4A'; g.beginPath(); g.roundRect(-396, -226, 792, 80, 32); g.fill();
g.save(); g.shadowColor = '#FFE27A'; g.shadowBlur = 90; g.fillStyle = '#FFE9A0'; g.beginPath(); g.roundRect(-370, -110, 450, 290, 28); g.fill(); g.restore(); g.beginPath(); g.roundRect(-370, -110, 450, 290, 28); g.stroke();
g.strokeStyle = '#B58A3A'; g.lineWidth = 8; for (let i = 0; i < 7; i++) { g.beginPath(); g.moveTo(-340 + i * 62, -90); g.lineTo(-340 + i * 62, 160); g.stroke(); }
g.fillStyle = INK; g.font = '900 150px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('TUE', -145, 35);
g.strokeStyle = INK; g.lineWidth = 18; g.fillStyle = '#F4F1EA'; g.beginPath(); g.arc(250, 30, 112, 0, 7); g.fill(); g.stroke(); g.beginPath(); g.moveTo(250, 30); g.lineTo(312, -48); g.stroke(); g.fillStyle = INK; g.beginPath(); g.arc(250, 30, 14, 0, 7); g.fill();
g.restore();
// calendar tag: MON
g.save(); g.translate(1930, 1010); g.rotate(0.08); g.fillStyle = '#FBF6E8'; g.strokeStyle = INK; g.lineWidth = 12; g.beginPath(); g.roundRect(-130, -140, 260, 280, 24); g.fill(); g.stroke(); g.fillStyle = '#E63946'; g.fillRect(-130, -140, 260, 80); g.strokeRect(-130, -140, 260, 80);
g.fillStyle = '#FFF'; g.font = '900 60px Inter'; g.fillText('MON', 0, -98); g.fillStyle = INK; g.font = '900 150px Inter'; g.fillText('16', 0, 30); g.restore();
// sparkles
for (let i = 0; i < 30; i++) { const a = R(i * 5.3) * Math.PI * 2, d = 480 + R(i * 2.2) * 380; const x = px + Math.cos(a) * d, y = py + Math.sin(a) * d * 0.7; const s = 10 + R(i) * 22;
  g.save(); g.translate(x, y); g.fillStyle = '#FFF6C8'; g.shadowColor = '#FFD43B'; g.shadowBlur = 24; g.beginPath(); g.moveTo(0, -s); g.lineTo(s * 0.25, -s * 0.25); g.lineTo(s, 0); g.lineTo(s * 0.25, s * 0.25); g.lineTo(0, s); g.lineTo(-s * 0.25, s * 0.25); g.lineTo(-s, 0); g.lineTo(-s * 0.25, -s * 0.25); g.closePath(); g.fill(); g.restore(); }
gr = g.createRadialGradient(W * 0.5, H * 0.5, H * 0.45, W * 0.5, H * 0.5, H * 1.15); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
// 4. text: right column
const word = (s, x, y, size, fill, glow, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillText(s, 10, 22); g.lineWidth = size * 0.2; g.strokeStyle = '#0B0B14'; g.strokeText(s, 0, 0);
  if (glow) { g.shadowColor = glow; g.shadowBlur = 60; } g.fillStyle = fill; g.fillText(s, 0, 0); g.shadowBlur = 0; g.restore(); };
const fit = (s, size, maxW) => { g.font = `900 ${size}px Inter`; return Math.min(size, size * maxW / g.measureText(s).width); };
word("IT'S MONDAY", 2020, 330, fit("IT'S MONDAY", 300, 1000), '#FFFFFF', '#5AB8FF', -0.05);
word('OR TUESDAY?!', 2020, 600, fit('OR TUESDAY?!', 320, 1000), '#FFD43B', null, -0.05);
g.save(); g.translate(2220, 1330); g.rotate(-0.05); g.fillStyle = '#7B5CFF'; g.strokeStyle = '#0B0B14'; g.lineWidth = 10; g.beginPath(); g.roundRect(-230, -56, 460, 112, 26); g.fill(); g.stroke(); g.fillStyle = '#FFFFFF'; g.font = '900 64px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SCI-FI STORY', 0, 4); g.restore();
document.title = 'DONE';
</script></body></html>
