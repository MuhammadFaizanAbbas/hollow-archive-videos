<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Inter';font-weight:900;src:url('fonts/Inter-Black.otf');} html,body{margin:0;background:#000} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><canvas id="c" width="2160" height="3840"></canvas>
<script type="module">
import { drawToon, INK } from './src/core/toon.js';
const c = document.getElementById('c'), g = c.getContext('2d'), W = 2160, H = 3840;
const R = (s) => { let x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
await document.fonts.load('900 100px Inter');
// sky + mars ground
let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1B1240'); gr.addColorStop(0.45, '#4B2A7A'); gr.addColorStop(0.62, '#9A4A5A'); gr.addColorStop(0.64, '#8A3A2A'); gr.addColorStop(1, '#4A1A14'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
g.fillStyle = '#fff'; for (let i = 0; i < 90; i++) { g.globalAlpha = 0.3 + R(i) * 0.6; g.beginPath(); g.arc(R(i * 3.7) * W, R(i * 8.3) * H * 0.5, 2 + R(i * 2) * 5, 0, 7); g.fill(); } g.globalAlpha = 1;
// red alert glow + rays
gr = g.createRadialGradient(1500, 1500, 60, 1500, 1500, 1500); gr.addColorStop(0, 'rgba(255,90,90,0.85)'); gr.addColorStop(0.35, 'rgba(230,57,70,0.4)'); gr.addColorStop(1, 'rgba(230,57,70,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
g.fillStyle = '#5A1E22'; g.beginPath(); g.moveTo(0, 2400); for (let x = 0; x <= W; x += 110) g.lineTo(x, 2280 - R(x) * 170); g.lineTo(W, 2500); g.lineTo(0, 2500); g.fill();
// MAP PIN (hero object, right)
g.save(); g.translate(1700, 1780); g.lineJoin = 'round';
g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(0, 560, 300, 70, 0, 0, 7); g.fill();
g.strokeStyle = INK; g.lineWidth = 26; g.fillStyle = '#FF3B3B'; g.shadowColor = '#FF6A6A'; g.shadowBlur = 90;
g.beginPath(); g.moveTo(0, 560); g.bezierCurveTo(-420, 120, -380, -380, 0, -380); g.bezierCurveTo(380, -380, 420, 120, 0, 560); g.closePath(); g.fill(); g.shadowBlur = 0; g.stroke();
g.fillStyle = '#FFFFFF'; g.beginPath(); g.arc(0, -40, 150, 0, 7); g.fill(); g.stroke();
g.strokeStyle = '#E63946'; g.lineWidth = 46; g.lineCap = 'round'; g.beginPath(); g.moveTo(-70, -110); g.lineTo(70, 30); g.moveTo(70, -110); g.lineTo(-70, 30); g.stroke();
g.restore();
// MEI (big face, left-centre, tearful)
g.save(); g.translate(-224, 1280); g.scale(4, 4);
drawToon(g, { body: '#4CAF50', hat: 'visor', hatCol: '#2E8B3E', hair: 'long', hairCol: '#1E1A1A', extra: ['glasses'] }, { mood: 'worried', look: [0.35, 0.1], talk: 0.4, sweat: 1, armR: [14, 10], armL: [14, 10] });
g.restore();
// vignette
gr = g.createRadialGradient(W / 2, H * 0.5, H * 0.3, W / 2, H * 0.5, H * 0.78); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(10,5,30,0.6)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
const word = (s, x, y, size, fill, glow, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillText(s, 14, 30); g.lineWidth = size * 0.2; g.strokeStyle = '#0B0B14'; g.strokeText(s, 0, 0); if (glow) { g.shadowColor = glow; g.shadowBlur = 60; } g.fillStyle = fill; g.fillText(s, 0, 0); g.restore(); };
const fit = (s, size, maxW) => { g.font = `900 ${size}px Inter`; return Math.min(size, size * maxW / g.measureText(s).width); };
word('SHE DID THIS', W / 2, 470, fit('SHE DID THIS', 330, 1950), '#FFFFFF', '#FFB3B3', -0.03);
word('ON PURPOSE', W / 2, 830, fit('ON PURPOSE', 360, 1950), '#FF4D4D', null, -0.03);
const pill = (txt, x, y, bg, rot, size, fg = '#FFFFFF') => { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; const w = g.measureText(txt).width + 110; g.fillStyle = bg; g.strokeStyle = '#0B0B14'; g.lineWidth = 12; g.beginPath(); g.roundRect(-w / 2, -size * 0.8, w, size * 1.6, 28); g.fill(); g.stroke(); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(txt, 0, 6); g.restore(); };
pill('AIR 6', 330, 140, '#E63946', -0.05, 84); pill('PART 5', 1850, 140, '#FFD43B', 0.05, 84, '#0B0B14');
document.title = 'DONE';
</script></body></html>
