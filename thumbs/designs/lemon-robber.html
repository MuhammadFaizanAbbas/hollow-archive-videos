<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Inter';font-weight:900;src:url('fonts/Inter-Black.otf');} html,body{margin:0;background:#000} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><canvas id="c" width="2160" height="3840"></canvas>
<script type="module">
import { drawToon, INK } from './src/core/toon.js';
const c = document.getElementById('c'), g = c.getContext('2d'), W = 2160, H = 3840;
const R = (s) => { let x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
await document.fonts.load('900 100px Inter');
let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#FFB52E'); gr.addColorStop(0.55, '#FFD84A'); gr.addColorStop(1, '#F29A1F'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
gr = g.createRadialGradient(W / 2, 2300, 100, W / 2, 2300, 1700); gr.addColorStop(0, 'rgba(255,255,230,0.9)'); gr.addColorStop(1, 'rgba(255,255,230,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
g.save(); g.translate(W / 2, 2350); g.globalCompositeOperation = 'screen'; for (let i = 0; i < 18; i++) { g.rotate(Math.PI * 2 / 18); g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-90, -2400); g.lineTo(90, -2400); g.closePath(); g.fill(); } g.restore();
// lemons scattered
const lemon = (x, y, s, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.scale(s, s); g.fillStyle = '#FFE94A'; g.strokeStyle = INK; g.lineWidth = 16; g.beginPath(); g.moveTo(-150, 0); g.bezierCurveTo(-130, -120, 130, -120, 150, 0); g.bezierCurveTo(130, 120, -130, 120, -150, 0); g.closePath(); g.fill(); g.stroke();
  g.fillStyle = '#FFF7A6'; g.beginPath(); g.ellipse(-40, -40, 60, 26, -0.4, 0, 7); g.fill(); g.fillStyle = '#7CC24A'; g.beginPath(); g.ellipse(150, -6, 36, 22, 0.3, 0, 7); g.fill(); g.stroke(); g.restore(); };
lemon(300, 1500, 2.2, -0.4); lemon(1900, 1650, 2.0, 0.5); lemon(1750, 3350, 2.4, 0.3); lemon(260, 3300, 1.7, -0.5);
// splash drops
g.fillStyle = 'rgba(255,255,255,0.8)'; for (let i = 0; i < 40; i++) { const x = R(i * 2.1) * W, y = 1300 + R(i * 5.3) * 2200, s = 10 + R(i) * 26; g.beginPath(); g.ellipse(x, y, s * 0.7, s, 0, 0, 7); g.fill(); }
// the robber: huge, smug, shiny
g.save(); g.translate(-220, 1130); g.scale(3.7, 3.7);
drawToon(g, { body: '#4F7FB8', head: '#EBC49A', hair: 'curly', hairCol: '#3A2A22', extra: ['juice', 'mustache'], neck: 'collar' }, { mood: 'proud', look: [0.4, 0.2], talk: 0, armR: [120, 40], armL: [10, 10] });
g.restore();
// polaroid with headless photo
g.save(); g.translate(1500, 2980); g.rotate(0.12); g.scale(0.9, 0.9); g.shadowColor = 'rgba(0,0,0,0.4)'; g.shadowBlur = 60; g.fillStyle = '#FBF8F0'; g.strokeStyle = INK; g.lineWidth = 18; g.beginPath(); g.roundRect(-400, -480, 800, 960, 30); g.fill(); g.shadowBlur = 0; g.stroke();
g.fillStyle = '#D8E6D0'; g.fillRect(-350, -430, 700, 700); g.strokeRect(-350, -430, 700, 700); g.fillStyle = '#EFC85A'; g.fillRect(-350, 120, 700, 150);
g.fillStyle = '#4F7FB8'; g.beginPath(); g.roundRect(-140, -60, 280, 380, 80); g.fill(); g.stroke();
g.setLineDash([22, 18]); g.strokeStyle = '#E63946'; g.lineWidth = 14; g.beginPath(); g.arc(0, -190, 130, 0, 7); g.stroke(); g.setLineDash([]); g.fillStyle = '#E63946'; g.font = '900 150px Inter'; g.textAlign = 'center'; g.fillText('?', 0, -140);
g.restore();

// NO FACE?! sticker
g.save(); g.translate(1560, 2200); g.rotate(-0.1); g.fillStyle = '#E63946'; g.strokeStyle = '#0B0B14'; g.lineWidth = 16; g.beginPath(); for (let i = 0; i < 28; i++) { const a = i / 28 * Math.PI * 2, r = i % 2 ? 300 : 380; g.lineTo(Math.cos(a) * r * 1.2, Math.sin(a) * r * 0.78); } g.closePath(); g.fill(); g.stroke();
g.fillStyle = '#FFFFFF'; g.font = '900 112px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('NO FACE?!', 0, 8); g.restore();
gr = g.createRadialGradient(W / 2, H * 0.55, H * 0.3, W / 2, H * 0.55, H * 0.78); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(120,50,0,0.45)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
const word = (s, x, y, size, fill, glow, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.fillStyle = 'rgba(0,0,0,0.45)'; g.fillText(s, 14, 30); g.lineWidth = size * 0.2; g.strokeStyle = '#0B0B14'; g.strokeText(s, 0, 0); if (glow) { g.shadowColor = glow; g.shadowBlur = 60; } g.fillStyle = fill; g.fillText(s, 0, 0); g.restore(); };
const fit = (s, size, maxW) => { g.font = `900 ${size}px Inter`; return Math.min(size, size * maxW / g.measureText(s).width); };
word("DON'T WATCH", W / 2, 470, fit("DON'T WATCH", 330, 1950), '#FFFFFF', '#FFF3A0', -0.03);
word("IF YOU'RE SMART", W / 2, 830, fit("IF YOU'RE SMART", 340, 1950), '#E63946', null, -0.03);
g.save(); g.translate(500, 130); g.rotate(-0.07); g.fillStyle = '#2E5FA8'; g.strokeStyle = '#0B0B14'; g.lineWidth = 12; g.beginPath(); g.roundRect(-290, -66, 580, 132, 30); g.fill(); g.stroke(); g.fillStyle = '#FFFFFF'; g.font = '900 84px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('100% TRUE', 0, 6); g.restore();
document.title = 'DONE';
</script></body></html>
