<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:'Inter';font-weight:900;src:url('fonts/Inter-Black.otf');} @font-face{font-family:'Caladea';font-weight:700;src:url('fonts/Caladea-Bold.ttf');} html,body{margin:0;background:#000} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><canvas id="c" width="2160" height="3840"></canvas>
<script type="module">
import { drawToon, INK } from './src/core/toon.js';
const c = document.getElementById('c'), g = c.getContext('2d'), W = 2160, H = 3840;
const R = (s) => { let x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
await document.fonts.load('900 100px Inter'); await document.fonts.load('700 100px Caladea');
// 1. night room: deep blue-purple, stars through a big window
let gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#0B1030'); gr.addColorStop(0.55, '#2A1C55'); gr.addColorStop(1, '#130B26'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
for (let i = 0; i < 260; i++) { const x = R(i) * W, y = R(i * 3.3) * H * 0.62, s = 2 + R(i * 7) * 7; g.fillStyle = `rgba(255,255,255,${0.35 + R(i * 9) * 0.6})`; g.beginPath(); g.arc(x, y, s, 0, 7); g.fill(); }
g.fillStyle = '#FFF4D6'; g.beginPath(); g.arc(1820, 520, 150, 0, 7); g.fill(); g.fillStyle = '#0B1030'; g.beginPath(); g.arc(1890, 470, 140, 0, 7); g.fill();
// 2. golden glow + rays behind the radio
const rx = W / 2, ry = 1950;
gr = g.createRadialGradient(rx, ry, 60, rx, ry, 1400); gr.addColorStop(0, 'rgba(255,225,140,0.95)'); gr.addColorStop(0.3, 'rgba(255,170,60,0.45)'); gr.addColorStop(1, 'rgba(255,140,40,0)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
g.save(); g.translate(rx, ry); g.globalCompositeOperation = 'screen'; for (let i = 0; i < 18; i++) { g.rotate(Math.PI * 2 / 18); g.fillStyle = 'rgba(255,220,150,0.10)'; g.beginPath(); g.moveTo(0, 0); g.lineTo(-110, -2200); g.lineTo(110, -2200); g.closePath(); g.fill(); } g.restore();
// sound waves
g.save(); g.lineCap = 'round'; for (let i = 0; i < 4; i++) { g.strokeStyle = `rgba(255,232,160,${0.85 - i * 0.18})`; g.lineWidth = 26 - i * 4; g.shadowColor = '#FFD27A'; g.shadowBlur = 40;
  g.beginPath(); g.arc(rx - 420, ry + 40, 420 + i * 120, -2.5, -1.75); g.stroke(); g.beginPath(); g.arc(rx + 420, ry + 40, 420 + i * 120, -1.4, -0.64); g.stroke(); } g.restore();
// 3. the newspaper flying out of the radio: TUESDAY
g.save(); g.translate(rx + 60, 1330); g.rotate(-0.12); g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 50; g.shadowOffsetY = 30;
g.fillStyle = '#F6F1E4'; g.strokeStyle = INK; g.lineWidth = 16; g.beginPath(); g.roundRect(-520, -330, 1040, 660, 20); g.fill(); g.shadowColor = 'transparent'; g.stroke();
g.fillStyle = INK; g.font = '700 92px Caladea'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('THE ISLAND TIMES', 0, -240); g.fillRect(-470, -186, 940, 8);
g.fillStyle = '#E63946'; g.beginPath(); g.roundRect(-330, -150, 660, 130, 24); g.fill(); g.stroke(); g.fillStyle = '#FFFFFF'; g.font = '900 104px Inter'; g.fillText('TUESDAY', 0, -82);
g.fillStyle = INK; g.font = '700 84px Caladea'; g.fillText('FINAL: 42 - 17', 0, 50);
g.fillStyle = '#9B958A'; for (let i = 0; i < 4; i++) g.fillRect(-470, 130 + i * 44, i === 3 ? 560 : 940, 18);
g.restore();
// 4. the radio: big vintage set, glowing dial
g.save(); g.translate(rx, ry); g.lineWidth = 20; g.strokeStyle = INK; g.lineJoin = 'round';
g.fillStyle = '#3A2418'; g.beginPath(); g.roundRect(-640, -300, 1280, 620, 70); g.fill(); g.stroke();
gr = g.createLinearGradient(0, -300, 0, 320); gr.addColorStop(0, '#F07A3C'); gr.addColorStop(1, '#C2481E'); g.fillStyle = gr; g.beginPath(); g.roundRect(-600, -270, 1200, 560, 56); g.fill(); g.stroke();
g.strokeStyle = '#8A5A2E'; g.lineWidth = 16; g.beginPath(); g.moveTo(460, -300); g.lineTo(640, -560); g.stroke(); g.fillStyle = INK; g.beginPath(); g.arc(640, -560, 22, 0, 7); g.fill();
// speaker grille glowing
g.save(); g.beginPath(); g.arc(-290, 10, 230, 0, 7); g.clip(); gr = g.createRadialGradient(-290, 10, 10, -290, 10, 240); gr.addColorStop(0, '#FFE9A8'); gr.addColorStop(1, '#E39A3A'); g.fillStyle = gr; g.fillRect(-540, -240, 500, 500);
g.strokeStyle = 'rgba(90,40,10,0.85)'; g.lineWidth = 22; for (let y = -200; y <= 220; y += 52) { g.beginPath(); g.moveTo(-540, y); g.lineTo(-40, y); g.stroke(); } g.restore();
g.lineWidth = 20; g.strokeStyle = INK; g.beginPath(); g.arc(-290, 10, 230, 0, 7); g.stroke(); g.strokeStyle = '#E8B04A'; g.lineWidth = 16; g.beginPath(); g.arc(-290, 10, 252, 0, 7); g.stroke();
// tuning window (glowing) with needle on TUE
g.fillStyle = '#FFF1C2'; g.shadowColor = '#FFD27A'; g.shadowBlur = 60; g.beginPath(); g.roundRect(30, -180, 480, 170, 24); g.fill(); g.shadowBlur = 0; g.strokeStyle = INK; g.lineWidth = 14; g.stroke();
g.fillStyle = INK; g.font = '900 54px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; ['MON', 'TUE', 'WED'].forEach((d, i) => { g.fillStyle = i === 1 ? '#E63946' : 'rgba(30,20,10,0.55)'; g.fillText(d, 110 + i * 160, -96); });
g.fillStyle = '#E63946'; g.fillRect(264, -40, 12, 22); g.beginPath(); g.moveTo(270, -50); g.lineTo(250, -20); g.lineTo(290, -20); g.closePath(); g.fill();
// knobs
[[140, 170], [400, 170]].forEach(([x, y]) => { g.fillStyle = '#F6E3B8'; g.beginPath(); g.arc(x, y, 80, 0, 7); g.fill(); g.lineWidth = 14; g.stroke(); g.fillStyle = INK; g.fillRect(x - 6, y - 70, 12, 50); });
g.restore();
// 5. the woman: shocked face filling the bottom, lit gold from the radio
g.save(); g.translate(170, 2380); g.scale(3.5, 3.5);
drawToon(g, { body: '#2FA89A', hat: 'bun', hatCol: '#8A5A3A', neck: 'scarf', neckCol: '#E8B23A', extra: ['glasses', 'blush'] },
  { mood: 'shock', look: [0, -0.8], talk: 0.9, sweat: 1, armL: [10, 6], armR: [10, 6] });
g.restore();
gr = g.createLinearGradient(0, 2200, 0, H); gr.addColorStop(0, 'rgba(10,6,25,0)'); gr.addColorStop(1, 'rgba(10,6,25,0.35)'); g.fillStyle = gr; g.fillRect(0, 2200, W, H - 2200);
// 6. vignette
gr = g.createRadialGradient(W / 2, H * 0.5, H * 0.3, W / 2, H * 0.5, H * 0.75); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.55)'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
// 7. text, top: two huge lines
const word = (s, x, y, size, fill, glow, rot) => { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillText(s, 14, 30); g.lineWidth = size * 0.2; g.strokeStyle = '#0B0B14'; g.strokeText(s, 0, 0);
  if (glow) { g.shadowColor = glow; g.shadowBlur = 70; } g.fillStyle = fill; g.fillText(s, 0, 0); g.shadowBlur = 0; g.restore(); };
const fit = (s, size, maxW) => { g.font = `900 ${size}px Inter`; return Math.min(size, size * maxW / g.measureText(s).width); };
word("TOMORROW'S", W / 2, 360, fit("TOMORROW'S", 300, 1900), '#FFFFFF', '#9FB4FF', -0.04);
word('NEWS?!', W / 2, 700, fit('NEWS?!', 420, 1700), '#FFD43B', null, -0.04);
// SCI-FI sticker, small
g.save(); g.translate(250, 120); g.rotate(-0.08); g.fillStyle = '#E63946'; g.strokeStyle = '#0B0B14'; g.lineWidth = 12; g.beginPath(); g.roundRect(-170, -60, 340, 120, 26); g.fill(); g.stroke();
g.fillStyle = '#FFFFFF'; g.font = '900 86px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('SCI-FI', 0, 6); g.restore();
document.title = 'DONE';
</script></body></html>
