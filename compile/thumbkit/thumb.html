<!doctype html><html><head><meta charset="utf-8">
<!-- Hollow Archive designed thumbnail. Copy into the project root as thumb.html, edit ONLY the DESIGN block, then:
     bash compile/thumbkit/render.sh . thumb.html renders/thumb.jpg short   (or long for 16:9)
     Proven layouts: thumbs/designs/tyres.html, radio-tomorrow.html (short), desert-water-long.html (long). -->
<style>@font-face{font-family:'Inter';font-weight:900;src:url('fonts/Inter-Black.otf');} @font-face{font-family:'Caladea';font-weight:700;src:url('fonts/Caladea-Bold.ttf');} html,body{margin:0;background:#000} canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head>
<body><canvas id="c"></canvas>
<script type="module">
import { drawToon, INK } from './src/core/toon.js';
const LONG = location.search.includes('k=long');
const c = document.getElementById('c'); c.width = LONG ? 2560 : 2160; c.height = LONG ? 1440 : 3840;
const g = c.getContext('2d'), W = c.width, H = c.height;
const R = (s) => { let x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };
await document.fonts.load('900 100px Inter'); await document.fonts.load('700 100px Caladea');
// ── toolkit ──────────────────────────────────────────────────────────────────────────────────────
const K = {
  sky(top, mid, bot) { const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(0.55, mid); gr.addColorStop(1, bot); g.fillStyle = gr; g.fillRect(0, 0, W, H); },
  async photo(src, sx = 0, sy = 0, sw = 1920, sh = 860, blur = 14) { const im = new Image(); im.src = src; await im.decode(); g.save(); g.filter = `blur(${blur}px) saturate(1.3)`;
    const s = Math.max(W / sw, H / sh); g.drawImage(im, sx, sy, sw, sh, (W - sw * s) / 2 - 40, (H - sh * s) / 2 - 40, sw * s + 80, sh * s + 80); g.restore(); },
  tint(c0, c1, vertical = false) { const gr = vertical ? g.createLinearGradient(0, 0, 0, H) : g.createLinearGradient(0, 0, W, 0); gr.addColorStop(0, c0); gr.addColorStop(1, c1); g.fillStyle = gr; g.fillRect(0, 0, W, H); },
  stars(n = 260, maxY = 0.6) { for (let i = 0; i < n; i++) { g.fillStyle = `rgba(255,255,255,${0.35 + R(i * 9) * 0.6})`; g.beginPath(); g.arc(R(i) * W, R(i * 3.3) * H * maxY, 2 + R(i * 7) * 7, 0, 7); g.fill(); } },
  aura(x, y, r, rgb) { const gr = g.createRadialGradient(x, y, r * 0.05, x, y, r); gr.addColorStop(0, `rgba(${rgb},0.95)`); gr.addColorStop(0.35, `rgba(${rgb},0.45)`); gr.addColorStop(1, `rgba(${rgb},0)`); g.fillStyle = gr; g.fillRect(0, 0, W, H); },
  rays(x, y, n = 16, rgb = '255,230,160', a = 0.12, len = 2400, wdt = 100) { g.save(); g.translate(x, y); g.globalCompositeOperation = 'screen'; for (let i = 0; i < n; i++) { g.rotate(Math.PI * 2 / n); g.fillStyle = `rgba(${rgb},${a})`; g.beginPath(); g.moveTo(0, 0); g.lineTo(-wdt, -len); g.lineTo(wdt, -len); g.closePath(); g.fill(); } g.restore(); },
  sparkles(x, y, n = 30, rMin = 260, rMax = 600, glow = '#9FE8FF') { for (let i = 0; i < n; i++) { const a = R(i * 5.3) * 6.283, d = rMin + R(i * 2.2) * (rMax - rMin), s = 10 + R(i) * 24;
    g.save(); g.translate(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8); g.fillStyle = '#FFF'; g.shadowColor = glow; g.shadowBlur = 24; g.beginPath(); [[0, -1], [.25, -.25], [1, 0], [.25, .25], [0, 1], [-.25, .25], [-1, 0], [-.25, -.25]].forEach(([u, v]) => g.lineTo(u * s, v * s)); g.closePath(); g.fill(); g.restore(); } },
  drop(x, y, s, fill = '#9FDCFF') { g.fillStyle = fill; g.strokeStyle = INK; g.lineWidth = 8; g.beginPath(); g.moveTo(x, y - s * 1.7); g.bezierCurveTo(x + s, y - s * .2, x + s, y + s, x, y + s); g.bezierCurveTo(x - s, y + s, x - s, y - s * .2, x, y - s * 1.7); g.fill(); g.stroke(); g.fillStyle = '#FFF'; g.beginPath(); g.ellipse(x - s * .35, y, s * .18, s * .35, .3, 0, 7); g.fill(); },
  burst(x, y, text, rot = 0.1, size = 120, fg = '#E63946') { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; const w = g.measureText(text).width; g.fillStyle = '#FFF'; g.strokeStyle = INK; g.lineWidth = 14; g.beginPath();
    for (let i = 0; i < 24; i++) { const a = i / 24 * 6.283, r = i % 2 ? 0.72 : 1; g.lineTo(Math.cos(a) * (w * 0.7) * r, Math.sin(a) * size * 1.45 * r); } g.closePath(); g.fill(); g.stroke(); g.fillStyle = fg; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 0, 6); g.restore(); },
  tag(x, y, text, bg = '#E63946', size = 96, rot = -0.08) { g.save(); g.translate(x, y); g.rotate(rot); g.font = `900 ${size}px Inter`; const w = g.measureText(text).width + size; g.fillStyle = bg; g.strokeStyle = '#0B0B14'; g.lineWidth = 12;
    g.beginPath(); g.roundRect(-w / 2, -size * 0.7, w, size * 1.4, size * 0.3); g.fill(); g.stroke(); g.fillStyle = '#FFF'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 0, size * 0.06); g.restore(); },
  person(look, st, x, y, scale) { g.save(); g.translate(x, y); g.scale(scale, scale); drawToon(g, look, st); g.restore(); },
  word(s, x, y, size, maxW, fill = '#FFF', glow = null, rot = -0.04) { g.save(); g.font = `900 ${size}px Inter`; size = Math.min(size, size * maxW / g.measureText(s).width); g.translate(x, y); g.rotate(rot);
    g.font = `900 ${size}px Inter`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; g.fillStyle = 'rgba(0,0,0,0.5)'; g.fillText(s, size * .045, size * .09);
    g.lineWidth = size * 0.2; g.strokeStyle = '#0B0B14'; g.strokeText(s, 0, 0); if (glow) { g.shadowColor = glow; g.shadowBlur = 70; } g.fillStyle = fill; g.fillText(s, 0, 0); g.restore(); },
  vignette(rgb = '0,0,0', a = 0.55) { const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.45, W / 2, H / 2, Math.max(W, H) * 0.75); gr.addColorStop(0, `rgba(${rgb},0)`); gr.addColorStop(1, `rgba(${rgb},${a})`); g.fillStyle = gr; g.fillRect(0, 0, W, H); },
  weather(kind = 'snow', n = 260) { g.save(); g.lineCap = 'round'; for (let i = 0; i < n; i++) { const x = R(i * 1.3) * W, y = R(i * 2.7) * H, l = 40 + R(i) * 80;
    if (kind === 'snow') { g.fillStyle = 'rgba(255,255,255,0.85)'; g.beginPath(); g.arc(x, y, 4 + R(i) * 10, 0, 7); g.fill(); } else { g.strokeStyle = kind === 'embers' ? 'rgba(255,190,90,0.7)' : 'rgba(255,255,255,0.5)'; g.lineWidth = 3 + R(i * 5) * 6; g.beginPath(); g.moveTo(x, y); g.lineTo(x - l * 0.45, y + l); g.stroke(); } } g.restore(); },
};
// ── DESIGN (edit only this block) ───────────────────────────────────────────────────────────────
// Rules: 1 hero object (the impossible thing) + 1 big face (strong emotion) + 2 text lines. Hot vs cold (or warm vs dark)
// colour contrast. Blurred background. No banner over the face, no logo. Character colours = the video's character.
const D = {
  line1: 'FLAT TYRES', line2: 'SAVED HIM?!', line1Fill: '#FFFFFF', line1Glow: '#9FD8FF', line2Fill: '#FFD43B',
  sticker: 'GENIUS TRICK',                                   // TRUE STORY · GENIUS TRICK · LEGEND · STORY TIME · SCI-FI
  who: { look: { body: '#D9A34A', hat: 'beanie', hatCol: '#D8343F', neck: 'scarf', neckCol: '#F2E6CF', extra: ['mustache'] },
         st: { mood: 'sly', look: [0.6, -0.4] } },
};
async function background() {                                // sky/photo + tint + glow behind the hero
  K.sky('#2C4C7A', '#7FA3CC', '#B9CDE2');
  K.aura(W / 2, H * 0.58, H * 0.42, '255,255,255');
}
function hero() {                                            // the impossible object, drawn big with ink outlines
  const x = W / 2, y = LONG ? H * 0.62 : H * 0.55; g.save(); g.translate(x, y); g.lineWidth = 22; g.strokeStyle = INK;
  g.fillStyle = '#1E212B'; g.beginPath(); g.ellipse(0, 0, 720, 360, 0, 0, 7); g.fill(); g.stroke();
  g.fillStyle = '#C9CCD6'; g.beginPath(); g.ellipse(0, -20, 320, 250, 0, 0, 7); g.fill(); g.stroke(); g.restore();
  if (LONG) { K.burst(W * 0.47, H * 0.3, 'PSSST!'); K.tag(W * 0.5, H * 0.9, '15 PSI'); } else { K.burst(W * 0.78, H * 0.41, 'PSSST!'); K.tag(W * 0.2, H * 0.42, '15 PSI'); }
}
// ── layout (same for every thumbnail) ───────────────────────────────────────────────────────────
await background();
hero();
if (LONG) K.person(D.who.look, { talk: 0.85, ...D.who.st }, -170, 180, 1.85);      // 16:9: face left third
else K.person(D.who.look, D.who.st, 230, 2760, 3.3);                                // 9:16: face fills the bottom
if (D.weather) K.weather(D.weather);
K.vignette();
if (LONG) { K.word(D.line1, W * 0.785, H * 0.29, 300, 1000, D.line1Fill, D.line1Glow); K.word(D.line2, W * 0.785, H * 0.515, 330, 1000, D.line2Fill); }
else { K.word(D.line1, W / 2, 450, 320, 1900, D.line1Fill, D.line1Glow); K.word(D.line2, W / 2, 800, 330, 1950, D.line2Fill); }
if (D.sticker) K.tag(LONG ? W - 300 : 330, LONG ? H - 110 : 120, D.sticker, '#E63946', LONG ? 60 : 78);
document.title = 'DONE';
</script></body></html>
